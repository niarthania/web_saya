<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-med" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#grad-med)"/>
  <rect x="0" y="0" width="18" height="560" fill="#000" opacity="0.4"/>
  <line x1="18" y1="0" x2="18" y2="560" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- DNA / Medical Cross graphic -->
  <circle cx="200" cy="270" r="75" fill="#065F46" stroke="#6EE7B7" stroke-width="2"/>
  <rect x="188" y="225" width="24" height="90" rx="6" fill="#A7F3D0"/>
  <rect x="155" y="258" width="90" height="24" rx="6" fill="#A7F3D0"/>
  <!-- Orbit rings -->
  <ellipse cx="200" cy="270" rx="95" ry="35" fill="none" stroke="#6EE7B7" stroke-width="1.5" transform="rotate(-30 200 270)"/>
  <ellipse cx="200" cy="270" rx="95" ry="35" fill="none" stroke="#6EE7B7" stroke-width="1.5" transform="rotate(30 200 270)"/>

  <!-- Badge -->
  <rect x="110" y="44" width="180" height="24" rx="12" fill="#065F46" stroke="#34D399" stroke-width="1"/>
  <text x="200" y="60" fill="#D1FAE5" font-family="'Inter', sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">KEDOKTERAN &amp; KESEHATAN</text>

  <!-- Title -->
  <text x="200" y="115" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="25" font-weight="800" text-anchor="middle">FARMAKOLOGI DASAR</text>
  <text x="200" y="145" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle">&amp; ANATOMI KLINIS</text>
  <text x="200" y="172" fill="#D1FAE5" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Panduan Diagnosis Komprehensif Tenaga Medis</text>

  <!-- Author -->
  <line x1="80" y1="470" x2="320" y2="470" stroke="#065F46" stroke-width="1"/>
  <text x="200" y="498" fill="#ECFDF5" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">dr. Nadia Kartika, Sp.PK</text>
  <text x="200" y="522" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">FAKULTAS KEDOKTERAN NASIONAL</text>
</svg>
