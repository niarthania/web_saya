<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sejarah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="60%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#grad-sejarah)"/>
  <rect x="0" y="0" width="18" height="560" fill="#000" opacity="0.45"/>
  <line x1="18" y1="0" x2="18" y2="560" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Compass / Antique Nautical Ornament -->
  <circle cx="200" cy="270" r="85" fill="none" stroke="#FDE68A" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="200" cy="270" r="70" fill="none" stroke="#FDE68A" stroke-opacity="0.2" stroke-dasharray="6,4"/>
  <polygon points="200,195 210,260 200,270 190,260" fill="#FDE68A" opacity="0.85"/>
  <polygon points="200,345 210,280 200,270 190,280" fill="#F59E0B" opacity="0.85"/>
  <polygon points="275,270 210,260 200,270 210,280" fill="#D97706" opacity="0.85"/>
  <polygon points="125,270 190,260 200,270 190,280" fill="#B45309" opacity="0.85"/>

  <!-- Badge -->
  <rect x="135" y="44" width="130" height="24" rx="4" fill="#B45309" fill-opacity="0.4" stroke="#FDE68A" stroke-width="1"/>
  <text x="200" y="60" fill="#FEF3C7" font-family="'Inter', serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">SEJARAH &amp; BUDAYA</text>

  <!-- Title -->
  <text x="200" y="115" fill="#FEF3C7" font-family="'Inter', serif" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="2">NUSANTARA</text>
  <text x="200" y="145" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">JEJAK JALUR REMPAH &amp; MARITIM</text>
  <text x="200" y="172" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle" font-style="italic">Dari Era Sriwijaya hingga Pembentukan Bangsa</text>

  <!-- Author -->
  <line x1="80" y1="470" x2="320" y2="470" stroke="#FDE68A" stroke-opacity="0.3" stroke-width="1"/>
  <text x="200" y="498" fill="#FFFBEB" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Dr. Asri Wardani, M.Hum.</text>
  <text x="200" y="522" fill="#FDE68A" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">LEMBAGA SEJARAH &amp; ARKEOLOGI</text>
</svg>
