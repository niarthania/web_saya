<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-sastra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B185F" />
      <stop offset="50%" stop-color="#A12568" />
      <stop offset="100%" stop-color="#FEC260" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5858" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F09819" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="560" fill="url(#grad-sastra)"/>
  <!-- Spine shadow effect -->
  <rect x="0" y="0" width="18" height="560" fill="#000" opacity="0.35"/>
  <line x1="18" y1="0" x2="18" y2="560" stroke="#FFF" stroke-opacity="0.15" stroke-width="1.5"/>
  
  <!-- Artwork / Abstract Sunset Silhouette -->
  <circle cx="200" cy="240" r="110" fill="url(#glow)"/>
  <path d="M 50 360 Q 140 280 230 320 T 400 300 L 400 560 L 50 560 Z" fill="#1E0A3C" opacity="0.95"/>
  <path d="M 0 400 Q 110 330 220 370 T 400 350 L 400 560 L 0 560 Z" fill="#0E051D"/>

  <!-- Badge / Genre -->
  <rect x="135" y="46" width="130" height="26" rx="13" fill="#FFF" fill-opacity="0.15" stroke="#FFF" stroke-opacity="0.3"/>
  <text x="200" y="63" fill="#FFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">NOVEL SASTRA</text>

  <!-- Title -->
  <text x="200" y="125" fill="#FFFFFF" font-family="'Inter', serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0.5">LEMBAYUNG</text>
  <text x="200" y="158" fill="#FEDB39" font-family="'Inter', serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="1">DI BALIK CAKRAWALA</text>
  <text x="200" y="185" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-style="italic" text-anchor="middle">Kisah Perjalanan Mencari Makna dan Harapan</text>

  <!-- Author & Publisher -->
  <line x1="80" y1="465" x2="320" y2="465" stroke="#FEC260" stroke-opacity="0.4" stroke-width="1"/>
  <text x="200" y="495" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Ahmad Fuadi Pratama</text>
  <text x="200" y="520" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1.5">PUSTAKA MEDIA INDONESIA</text>
</svg>
